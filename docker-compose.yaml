version: "3.8"

services:
  messages-redis:
    image: redis:7
    command: --requirepass ${REDIS_PASSWORD}
    networks:
      - prod-mynetwork
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - redis_data:/data
    env_file:
      - ./.env

  postgres-db:
    image: postgres:16
    networks:
      - prod-mynetwork
    ports:
      - ${MSGSQLDB_PORT}:${MSGSQLDB_PORT}
    environment:
      POSTGRES_DB: ${MSGSQLDB_DATABASE}
      POSTGRES_USER: ${MSGSQLDB_USER}
      POSTGRES_PASSWORD: ${MSGSQLDB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker_volume/postgres:/docker-entrypoint-initdb.d:ro
    env_file:
      - ./.env

  mongodb:
    image: mongo:7
    networks:
      - prod-mynetwork
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGODB_MESSAGES_USERNAME=: ${MONGODB_MESSAGES_USERNAME}
      MONGODB_MESSAGES_PASSWORD=: ${MONGODB_MESSAGES_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/docker_volume/mongo:/docker-entrypoint-initdb.d:ro
    env_file:
      - ./.env

volumes:
  redis_data:
  postgres_data:
  mongodb_data:

networks:
  prod-mynetwork:
