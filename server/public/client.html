<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO test</title>
    <link rel="stylesheet" href="chat.css" />
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="chat.js" defer></script>
  </head>
  <body>
    <h1>Socket.IO Chat</h1>
    <input
      class="input-field"
      type="text"
      id="conversationId"
      value="b619308f-e44f-43c6-881d-2b75f8871f48"
    />
    <select class="input-field" id="userId">
      <option value="">Select User</option>
      <option value="123e4567-e89b-12d3-a456-426614174001">User 1</option>
      <option value="123e4567-e89b-12d3-a456-426614174002">User 2</option>
    </select>
    <select class="input-field" id="recipientId">
      <option value="123e4567-e89b-12d3-a456-426614174001">User 1</option>
      <option value="123e4567-e89b-12d3-a456-426614174002">User 2</option>
    </select>
    <input
      class="input-field"
      type="text"
      id="message"
      placeholder="Type a message"
    />
    <button id="sendButton">Send</button>
    <div id="messages"></div>
    <p class="activity"></p>
  </body>
</html>
